<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Inbox Demo — Team Zero</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Live inbox demo</h1>
      <p>Messages arrive one by one and are checked in real time by our AI on IBM LinuxONE.</p>
      <nav><a href="/">Checker</a><a href="/inbox">Live inbox demo</a></nav>
    </div>
  </header>

  <main>
    <div class="row" style="margin-bottom:12px">
      <button class="ghost" id="restart" type="button">↻ Restart demo</button>
      <span class="hint">Demo messages are made up; names and numbers are not real.</span>
    </div>
    <div class="inbox-layout">
      <div class="phone">
        <div class="screen" id="messages">
          <div class="screen-top">Messages</div>
        </div>
      </div>
      <section id="detail" class="card detail">Tap a message to see why it got its label.</section>
    </div>
  </main>

  <footer>Team Zero · IBM Z Datathon 2026 · Runs on IBM LinuxONE</footer>

  <script src="{{ url_for('static', filename='js/result.js') }}"></script>
  <script src="{{ url_for('static', filename='js/inbox.js') }}"></script>
</body>
</html>
